name: sdlc-deck-lab-preview
services:
  app:
    image: deck-lab-preview:local
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    networks: [isolated]
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    volumes:
      - ./preview-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 127.0.0.1:5187:8080
    networks: [isolated, ingress]
    depends_on: [app]
networks:
  isolated:
    internal: true
  ingress: {}
