name: Dispatcher checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[server,dev]'
      - name: Lint and format
        run: |
          ruff check src tests integrations/deck-lab/*.py
          black --check src tests integrations/deck-lab/*.py
      - name: Unit and provider-contract tests (offline)
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          retention-days: 14
  containers:
    name: Container boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build disposable test image
        run: docker build -f containers/test.Dockerfile -t sdlc-dispatcher-test:local .
      - name: Container boundary and feedback-to-artifact demo
        run: PYTHONPATH=src DISPATCHER_DOCKER_TESTS=1 python -m unittest discover -s tests -p test_docker.py -v
  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke test the installed distribution outside the source tree
        run: |
          python -m venv /tmp/dispatcher-wheel
          /tmp/dispatcher-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/dispatcher-wheel/bin/sdlc-dispatcher --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          retention-days: 14
