name: Dispatcher checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and provider-contract tests (offline)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Install development checks
        run: pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check src tests integrations/deck-lab/*.py
          black --check src tests integrations/deck-lab/*.py
      - name: Build disposable test image
        run: docker build -f containers/test.Dockerfile -t sdlc-dispatcher-test:local .
      - name: Container boundary and feedback-to-artifact demo
        run: PYTHONPATH=src DISPATCHER_DOCKER_TESTS=1 python -m unittest discover -s tests -p test_docker.py -v
