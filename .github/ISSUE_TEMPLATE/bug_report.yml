name: Bug report
description: Report a reproducible dispatcher failure.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private feedback, or raw .dispatcher artifacts. Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal configuration and commands, with private values replaced.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit, Python version, OS, Docker version, and coding engine if relevant.
    validations:
      required: true
