[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-dispatcher"
version = "0.1.0"
description = "A project-independent, approval-gated feedback-to-patch dispatcher"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = ["waitress>=3,<4"]
dev = ["black==26.5.1", "ruff==0.16.4"]

[project.scripts]
sdlc-dispatcher = "sdlc_dispatcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
