id = "my-app"
repository = "../../my-app"
base_ref = "main"
image = "my-app-agent:local"
github_repository = "your-account/your-app"
checks = [["python", "-m", "unittest", "discover", "-v"]]
allowed_paths = ["src/**", "tests/test_*.py"]
protected_paths = ["src/auth/**", "src/migrations/**"]
automatic_intake = false
max_daily_runs = 3
max_attempts = 2
timeout_seconds = 900
max_changed_files = 12
max_patch_bytes = 200000

